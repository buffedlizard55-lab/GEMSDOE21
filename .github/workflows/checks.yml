name: Verified research and download checks
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src scripts tests && ruff format --check src scripts tests
      - run: python -m pytest -q
      - name: Static link, hash and published TIFF validation
        run: python scripts/check_site.py
      - name: Install Chromium for end-to-end checks
        run: python -m playwright install --with-deps chromium
      - name: Desktop, mobile, SHA-verified download and corruption tests
        run: python scripts/check_site.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-site-checks
          path: .cache/site-checks/
          retention-days: 14

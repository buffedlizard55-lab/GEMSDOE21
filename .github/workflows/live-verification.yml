name: Verify actual live Pages downloads
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment', 'pages-build-deployment']
    types: [completed]
  push:
    branches: ['arena/**']
    paths:
      - scripts/verify_live.py
      - .github/workflows/live-verification.yml
permissions:
  contents: write
jobs:
  live:
    # workflow_run has write scope: accept ONLY our own successful main Pages deployment.
    # Never check out/run a fork's code under this release-writing token.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch actual served content and validate the downloaded GeoTIFFs and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export LIVE_MAIN_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python scripts/verify_live.py
      - name: Preserve live receipt in public release metadata, not a bot main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view delivery-verification --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit delivery-verification --repo "$GITHUB_REPOSITORY" --notes-file live-verification.json --title "Verified live Pages downloads — not a competition score"
          else
            gh release create delivery-verification --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file live-verification.json --title "Verified live Pages downloads — not a competition score" --prerelease
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-live-download-verification
          path: live-verification.json
          retention-days: 30
